[package]
name = "gov"
version = "0.1.0"
edition = "2024"
description = "Governance CLI for ComfyUI dependency transactions"

[[bin]]
name = "gov"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.39", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml_edit = { version = "0.22.27", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
